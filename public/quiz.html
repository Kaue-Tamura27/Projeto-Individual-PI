<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Flavoria</title>

    <link rel="stylesheet" href="../style.css">

    <style>

        #pontuacaoEJogo{
            background-color: #F4F1EC;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 40px;
            font-family: "Barlow", sans-serif;
        }

        #btnIniciarQuiz,
        #btnSubmeter,
        #btnProx,
        #btnTentarNovamente{

            cursor: pointer;
            border: none;
            border-radius: 10px;
            padding: 14px 22px;
            background-color: #C9A66B;
            color: white;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        #btnIniciarQuiz:hover,
        #btnSubmeter:hover,
        #btnProx:hover,
        #btnTentarNovamente:hover{

            background-color: #b89355;
            transform: scale(1.03);
        }

        #pontuacao{

            display: flex;
            flex-direction: column;
            gap: 10px;

            background-color: #1C1C1C;
            color: white;

            padding: 25px;

            border-radius: 20px;

            width: 400px;
        }

        #jogo{

            background-color: white;

            width: 700px;

            padding: 35px;

            border-radius: 20px;

            border-top: 6px solid #C9A66B;

            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        #infoQuestao,
        #perguntaDaQuestaoAtual,
        #infoAlternativas,
        #opcoes,
        #botoes{
            margin-bottom: 25px;
        }

        #spanQuestaoExibida{

            font-size: 28px;
            font-weight: bold;
            color: #1C1C1C;
        }

        #opcoes{

            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #opcoes span{

            background-color: #F4F1EC;

            padding: 15px;

            border-radius: 12px;

            border: 2px solid transparent;

            transition: 0.3s;
        }

        #opcoes span:hover{

            border-color: #C9A66B;
        }

        .option{

            font-size: 17px;
            cursor: pointer;
        }

        .radio{

            margin-right: 10px;
            accent-color: #C9A66B;
        }

        #botoes{

            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .text-success-with-bg{

            background-color: #d4edda !important;
            border: 2px solid #28a745 !important;
            color: #155724 !important;
        }

        .text-danger-with-bg{

            background-color: #f8d7da !important;
            border: 2px solid #dc3545 !important;
            color: #721c24 !important;
        }

        .text-warning-with-bg{

            background-color: #fff3cd !important;
            border: 2px solid #ffc107 !important;
            color: #856404 !important;
        }

    </style>

</head>

<body onload="onloadEsconder()">

    <div id="pontuacaoEJogo">

        <button id="btnIniciarQuiz" onclick="iniciarQuiz()">
            INICIAR QUIZ
        </button>

        <div id="pontuacao">

            <span>
                Acertos:
                <span id="spanCertas">0</span>
            </span>

            <span>
                Erros:
                <span id="spanErradas">0</span>
            </span>

            <span>
                Pontuação Final:
                <span id="spanPontuacaoFinal">0</span>
            </span>

            <span id="msgFinal"></span>

        </div>

        <div id="jogo">

            <div id="infoQuestao">

                Questão
                <span id="spanNumeroDaQuestaoAtual"></span>
                de
                <span id="qtdQuestoes"></span>

            </div>

            <div id="perguntaDaQuestaoAtual">

                <span id="spanQuestaoExibida"></span>

            </div>

            <div id="infoAlternativas">

                <em>Escolha uma alternativa:</em>

            </div>

            <div id="opcoes">

                <span>

                    <input type="radio"
                           id="primeiraOpcao"
                           name="option"
                           class="radio"
                           value="alternativaA">

                    <label for="primeiraOpcao"
                           class="option"
                           id="labelOpcaoUm"></label>

                </span>

                <span>

                    <input type="radio"
                           id="segundaOpcao"
                           name="option"
                           class="radio"
                           value="alternativaB">

                    <label for="segundaOpcao"
                           class="option"
                           id="labelOpcaoDois"></label>

                </span>

                <span>

                    <input type="radio"
                           id="terceiraOpcao"
                           name="option"
                           class="radio"
                           value="alternativaC">

                    <label for="terceiraOpcao"
                           class="option"
                           id="labelOpcaoTres"></label>

                </span>

                <span>

                    <input type="radio"
                           id="quartaOpcao"
                           name="option"
                           class="radio"
                           value="alternativaD">

                    <label for="quartaOpcao"
                           class="option"
                           id="labelOpcaoQuatro"></label>

                </span>

            </div>

            <div id="botoes">

                <button onclick="submeter()" id="btnSubmeter">
                    Submeter resposta
                </button>

                <button onclick="avancar()" id="btnProx" disabled>
                    Próxima questão
                </button>

                <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>
                    Tentar novamente
                </button>

            </div>

        </div>

    </div>

    <script src="./quiz.js"></script>

</body>

</html>
