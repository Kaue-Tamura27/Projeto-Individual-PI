<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz | Flavoria</title>

    <link rel="stylesheet" href="./css/estilo.css">

    <link rel="stylesheet" href="./css/quiz.css">
</head>

<body onload="carregarQuiz()">
    <div class="header">
        <div class="container">
            <h1 class="titulo">Flavoria</h1>
            <ul class="navbar">
                <li>
                    <a href="index.html">Início</a>
                </li>
                <li class="agora">
                    <a href="quiz.html">Quiz</a>
                </li>
                <li>|</li>
                <li>
                    <a href="cadastro.html">Cadastro</a>
                </li>
                <li>
                    <a href="login.html">Login</a>
                </li>
            </ul>
        </div>
    </div>
    <section class="quiz-section">
        <div class="quiz-container">
            <h1 class="quiz-titulo">
                Que tipo de cozinheiro você é?
            </h1>
            <p class="quiz-subtitulo">
                Descubra sua personalidade culinária
            </p>
            <div class="quiz-info">
                <span>
                    Questão:
                    <span id="spanQuestaoAtual">1</span>
                    /
                    <span id="spanTotalQuestoes">0</span>
                </span>
            </div>
            <div class="quiz-pergunta" id="divPergunta">
                Carregando pergunta...
            </div>
            <div class="quiz-opcoes" id="divOpcoes">
            </div>
            <div class="quiz-botoes">
                <button id="btnResponder" onclick="responder()">
                    Responder
                </button>

            </div>

        </div>

    </section>

  
    <div class="footer">

        <div class="container">

            <h4>
                Projeto informativo sobre gastronomia 2026
            </h4>

            <span class="version">
                v1.0.0
            </span>

        </div>

    </div>


    <script src="./js/quiz.js"></script>

</body>

</html>
