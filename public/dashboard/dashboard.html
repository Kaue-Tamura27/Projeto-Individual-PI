<script>

    // =====================================================
    // CARREGAR DASHBOARD
    // =====================================================

    async function carregarDashboard() {

        var idUsuario = sessionStorage.ID_USUARIO;

        try {

            // BUSCA RESULTADO DO USUÁRIO

            const resposta = await fetch(`/quiz/resultado/${idUsuario}`);

            const dados = await resposta.json();

            console.log("RESULTADO USUÁRIO:");
            console.log(dados);

            const resultado = dados[0];

            // KPI PERFIL FINAL

            document.getElementById("kpiPerfil").innerHTML =
                resultado.perfilFinal;

            // CRIA O GRÁFICO

            criarGrafico(resultado);

            // CARREGA ESTATÍSTICAS GERAIS

            carregarEstatisticas();

        } catch (erro) {

            console.log("ERRO AO CARREGAR DASH:");
            console.log(erro);

        }
    }

    // =====================================================
    // CARREGAR KPIS
    // =====================================================

    async function carregarEstatisticas() {

        try {

            const resposta =
                await fetch("/quiz/estatisticas");

            const dados = await resposta.json();

            console.log("ESTATÍSTICAS:");
            console.log(dados);

            // TOTAL DE QUIZZES

            let total = 0;

            dados.forEach(item => {

                total += item.quantidade;

            });

            document.getElementById("kpiTotal").innerHTML =
                total;

            // PERFIL MAIS POPULAR

            document.getElementById("kpiPopular").innerHTML =
                dados[0].perfilFinal;

        } catch (erro) {

            console.log("ERRO NAS ESTATÍSTICAS:");
            console.log(erro);

        }
    }

    // =====================================================
    // CRIAR GRÁFICO
    // =====================================================

    function criarGrafico(resultado) {

        console.log("CRIANDO GRÁFICO");

        const ctx =
            document.getElementById("graficoPerfis");

        new Chart(ctx, {

            type: 'bar',

            data: {

                labels: [

                    'Tradicional',
                    'Gourmet',
                    'Criativo',
                    'Raiz',
                    'Fit',
                    'Confeiteiro',
                    'Aventureiro'

                ],

                datasets: [{

                    label: 'Porcentagem (%)',

                    data: [

                        resultado.porcentagemTradicional,
                        resultado.porcentagemGourmet,
                        resultado.porcentagemCriativo,
                        resultado.porcentagemRaiz,
                        resultado.porcentagemFit,
                        resultado.porcentagemConfeiteiro,
                        resultado.porcentagemAventureiro

                    ],

                    borderWidth: 1

                }]
            },

            options: {

                responsive: true,

                scales: {

                    y: {

                        beginAtZero: true,

                        max: 100

                    }
                }
            }
        });
    }
